<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال التجويد - السلم والثعبان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>السلم والثعبان: أبطال التجويد 👑</h1>
    
    <div id="game-container">
        <!-- رقعة اللعبة سيتم توليدها برمجياً هنا -->
        <div id="board"></div>
        
        <div id="controls">
            <button id="ask-btn" onclick="showQuestion()">اسحب بطاقة سؤال 📝</button>
            <button id="dice-btn" onclick="rollDice()" disabled>ارمي النرد 🎲</button>
            <p id="message">اضغط على سحب بطاقة لتبدأ رحلتك!</p>
        </div>
    </div>

    <!-- مربع السؤال / المراجعة -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            <h2 id="lesson-text"></h2>
            <p id="question-text"></p>
            <div id="options"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
