<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال التجويد - تحفة الأطفال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>السلم والثعبان: رحلة التجويد 👑</h1>
    
    <div id="game-container">
        <!-- رقعة اللعبة -->
        <div id="board"></div>
        
        <!-- لوحة التحكم -->
        <div id="controls">
            <!-- الفهرس الجديد -->
            <div class="index-container">
                <label for="lesson-index">فهرس الأحكام:</label>
                <select id="lesson-index" onchange="jumpToLesson()"></select>
            </div>

            <div id="dice-display">🎲</div>
            <button id="ask-btn" onclick="drawCard()">اسحب بطاقة 📝</button>
            <button id="dice-btn" onclick="rollDice()" disabled>ارمي النرد</button>
            <p id="message">اختر حكماً من الفهرس أو اسحب بطاقة لتبدأ!</p>
        </div>
    </div>

    <!-- مربع السؤال والشرح -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            <!-- قسم الشرح -->
            <div id="lesson-section" class="hidden">
                <h2 id="lesson-title"></h2>
                <p id="lesson-text"></p>
                <button id="understand-btn" onclick="showQuestion()" class="action-btn">فهمت، اعرض السؤال 🚀</button>
                <button id="close-fail-btn" onclick="closeModalAndWait()" class="fail-btn hidden">العودة للرقعة</button>
            </div>
            
            <!-- قسم السؤال (عربي/إنجليزي) -->
            <div id="question-section" class="hidden">
                <p id="chapter-branch-label" class="badge"></p>
                <h3 id="question-counter"></h3>
                <!-- النص العربي -->
                <p id="question-text-ar" class="q-ar"></p>
                <!-- النص الإنجليزي -->
                <p id="question-text-en" class="q-en" dir="ltr"></p>
                
                <div id="options"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
